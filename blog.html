<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>블로그 분석기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --surface2: #f0f1f5;
  --border: #e2e4ec;
  --accent: #5b52e8;
  --accent-o: rgba(91,82,232,0.1);
  --orange: #f07b30;
  --orange-o: rgba(240,123,48,0.1);
  --green: #18a86b;
  --green-o: rgba(24,168,107,0.1);
  --yellow: #f5a623;
  --red: #e53e3e;
  --text: #1a1d2e;
  --muted: #8a8fa8;
  --border2: #d0d3e0;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
}
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 14px 20px; display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm);
}
.hlogo { width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0; background: linear-gradient(135deg,var(--accent),#8b7ff5); display: flex; align-items: center; justify-content: center; font-size: 16px; }
.htitle { font-size: 0.95rem; font-weight: 700; }
.hsub { font-size: 0.6rem; color: var(--muted); font-family: 'JetBrains Mono',monospace; }

.wrap { padding: 16px; max-width: 640px; margin: 0 auto; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
.panel-head { font-size: 0.68rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }

.igroup { margin-bottom: 12px; }
.igroup:last-child { margin-bottom: 0; }
.igroup label { display: flex; align-items: center; gap: 7px; font-size: 0.75rem; font-weight: 600; margin-bottom: 7px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.da { background: var(--accent); } .db { background: var(--orange); }
.bname { font-size: 0.65rem; color: var(--muted); font-weight: 400; }
input[type=text] { width: 100%; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 9px; padding: 11px 13px; color: var(--text); font-size: 0.85rem; font-family: 'JetBrains Mono',monospace; transition: border-color .2s; -webkit-appearance: none; }
input:focus { outline: none; border-color: var(--accent); background: #fff; }
.hint { font-size: 0.63rem; color: var(--muted); margin-top: 4px; }

.kw-row { display: flex; gap: 8px; margin-bottom: 10px; }
.kw-row input { flex: 1; }
.btn-add { padding: 11px 14px; border-radius: 9px; border: none; font-weight: 700; font-size: 0.82rem; cursor: pointer; background: var(--accent); color: #fff; font-family: 'Noto Sans KR',sans-serif; white-space: nowrap; flex-shrink: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; }
.chip { display: flex; align-items: center; gap: 5px; background: var(--accent-o); border: 1.5px solid var(--accent); border-radius: 20px; padding: 4px 11px; font-size: 0.75rem; font-weight: 600; color: var(--accent); animation: pop .18s ease; }
@keyframes pop { from{transform:scale(.7);opacity:0} to{transform:scale(1);opacity:1} }
.chip-x { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; padding: 0; line-height: 1; }

.thr-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface2); border-radius: 10px; margin-top: 12px; }
.thr-row label { font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
.thr-row input[type=range] { flex: 1; accent-color: var(--accent); }
.thr-val { font-family: 'JetBrains Mono',monospace; font-size: 0.85rem; font-weight: 700; color: var(--accent); min-width: 38px; text-align: right; }

.btn-main { width: 100%; padding: 14px; border-radius: 11px; border: none; margin-top: 12px; background: linear-gradient(135deg,var(--accent),#8b7ff5); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; font-family: 'Noto Sans KR',sans-serif; box-shadow: 0 4px 14px rgba(91,82,232,0.3); }
.btn-main:active { opacity: .88; }
.btn-main:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

.results { display: none; }
.results.on { display: block; }

.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.sbox { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 11px 14px; box-shadow: var(--shadow-sm); }
.sbox span { display: block; font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 3px; }
.sbox strong { font-size: 1.3rem; font-weight: 700; font-family: 'JetBrains Mono',monospace; }
.sbox.c-accent strong { color: var(--accent); }
.sbox.c-green strong { color: var(--green); }
.sbox.c-orange strong { color: var(--orange); }
.sbox.c-yellow strong { color: var(--yellow); }

.tabs { display: flex; gap: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
.tab { flex: 1; padding: 9px 4px; border-radius: 9px; border: none; background: none; color: var(--muted); font-size: 0.72rem; font-weight: 600; cursor: pointer; font-family: 'Noto Sans KR',sans-serif; text-align: center; white-space: nowrap; }
.tab.on { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(91,82,232,0.3); }
.tab .badge { display: inline-block; margin-left: 2px; padding: 1px 5px; border-radius: 10px; font-size: 0.6rem; font-weight: 700; }
.tab.on .badge { background: rgba(255,255,255,0.25); color: #fff; }
.tab:not(.on) .badge { background: var(--surface2); color: var(--muted); }

.pane { display: none; }
.pane.on { display: block; }

.filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.fbtn { padding: 5px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--muted); font-family: 'Noto Sans KR',sans-serif; box-shadow: var(--shadow-sm); }
.fbtn.on-all  { border-color: var(--green);  background: var(--green-o);  color: var(--green); }
.fbtn.on-a    { border-color: var(--accent); background: var(--accent-o); color: var(--accent); }
.fbtn.on-b    { border-color: var(--orange); background: var(--orange-o); color: var(--orange); }
.fbtn.on-kw   { border-color: var(--accent); background: var(--accent-o); color: var(--accent); }

.post-list { display: flex; flex-direction: column; gap: 10px; }

.pcard { background: var(--surface); border: 1.5px solid var(--border); border-radius: 13px; padding: 14px 16px; display: block; box-shadow: var(--shadow-sm); animation: fadeup .2s ease both; transition: border-color .15s; }
.pcard.hl-yellow { background: #fffbea; border-color: #f5a623; }
.pcard.hl-pink   { background: #fff5f5; border-color: #fc8181; }
.pcard.hl-green  { background: #f0fff8; border-color: #38c98a; }
.pcard.bookmarked { border-color: var(--accent); }
@keyframes fadeup { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

.pm { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; flex-wrap: wrap; }
.sbadge { font-size: 0.62rem; font-weight: 700; padding: 2px 8px; border-radius: 5px; }
.sbadge.a { background: var(--accent-o); color: var(--accent); }
.sbadge.b { background: var(--orange-o); color: var(--orange); }
.kbadge { font-size: 0.62rem; font-weight: 600; padding: 2px 8px; border-radius: 5px; background: var(--green-o); color: var(--green); }
.pdate { font-size: 0.64rem; color: var(--muted); font-family: 'JetBrains Mono',monospace; }
.ptitle { font-size: 0.9rem; font-weight: 700; margin-bottom: 5px; line-height: 1.5; }
.pdesc { font-size: 0.78rem; color: var(--muted); line-height: 1.65; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
mark { background: rgba(245,166,35,.2); color: #9a6500; border-radius: 3px; padding: 0 2px; font-weight: 700; }

.card-link { text-decoration: none; color: inherit; display: block; }

/* ACTION BAR */
.action-bar { display: flex; gap: 6px; margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.act-btn { display: flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 7px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 0.7rem; font-weight: 600; cursor: pointer; font-family: 'Noto Sans KR',sans-serif; transition: all .15s; }
.act-btn.bm-on   { border-color: var(--accent); background: var(--accent-o); color: var(--accent); }
.act-btn.hl-y-on { border-color: #f5a623; background: #fffbea; color: #9a6500; }
.act-btn.hl-p-on { border-color: #fc8181; background: #fff5f5; color: var(--red); }
.act-btn.hl-g-on { border-color: #38c98a; background: #f0fff8; color: var(--green); }

/* PAIR */
.pair-card { background: var(--surface); border: 1.5px solid rgba(24,168,107,.3); border-radius: 13px; overflow: hidden; margin-bottom: 10px; box-shadow: var(--shadow-sm); animation: fadeup .2s ease both; }
.pair-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--green-o); border-bottom: 1px solid rgba(24,168,107,.15); font-size: 0.72rem; font-weight: 700; color: var(--green); }
.sim-score { margin-left: auto; background: rgba(24,168,107,.15); padding: 2px 9px; border-radius: 8px; font-family: 'JetBrains Mono',monospace; }
.pair-side { padding: 12px 14px; border-bottom: 1px solid var(--border); }
.pair-side:last-child { border-bottom: none; }
.pair-side-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; }
.pair-side.winner .pair-side-label { color: var(--green); }
.pair-side.loser .pair-side-label { color: var(--muted); }
.pair-side.loser { opacity: .55; }
.pair-title { font-size: 0.85rem; font-weight: 700; line-height: 1.45; margin-bottom: 3px; }
.pair-title a { color: var(--text); text-decoration: none; }
.pair-info { font-size: 0.65rem; color: var(--muted); font-family: 'JetBrains Mono',monospace; margin-top: 4px; }
.info-len { color: var(--green); font-weight: 600; }

.section-label { font-size: 0.68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin: 14px 0 8px; padding-left: 2px; }

.empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.empty .ico { font-size: 2.2rem; margin-bottom: 10px; }
.empty p { font-size: 0.82rem; line-height: 1.7; }
.spin { width: 32px; height: 32px; margin: 0 auto 12px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: rot .7s linear infinite; }
@keyframes rot { to{transform:rotate(360deg)} }

.error-box { background: #fff5f5; border: 1.5px solid #fed7d7; border-radius: 10px; padding: 14px; font-size: 0.8rem; line-height: 1.7; color: var(--red); margin-bottom: 12px; display: none; }
.error-box.on { display: block; }
</style>
</head>
<body>
<header>
  <div class="hlogo">📊</div>
  <div>
    <div class="htitle">블로그 분석기</div>
    <div class="hsub">keyword · similarity · bookmark</div>
  </div>
</header>

<div class="wrap">
  <div class="panel">
    <div class="panel-head">📌 블로그 설정</div>
    <div class="igroup">
      <label><span class="dot da"></span>블로그 A <span class="bname">소유 님의 블로그</span></label>
      <input type="text" id="blogA" value="vnfthdb" placeholder="블로그 ID">
      <div class="hint">m.blog.naver.com/<b>vnfthdb</b> ← 이 부분</div>
    </div>
    <div class="igroup">
      <label><span class="dot db"></span>블로그 B <span class="bname">알뜰살뜰 리치언니</span></label>
      <input type="text" id="blogB" value="ek60044" placeholder="블로그 ID">
      <div class="hint">m.blog.naver.com/<b>ek60044</b> ← 이 부분</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">🔍 키워드 필터 (제목 기준)</div>
    <div class="kw-row">
      <input type="text" id="kwInput" placeholder="키워드 입력 후 추가">
      <button class="btn-add" onclick="addKeyword()">+ 추가</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="thr-row">
      <label>🔁 유사도</label>
      <input type="range" id="thrSlider" min="50" max="100" value="70" oninput="document.getElementById('thrVal').textContent=this.value+'%'">
      <span class="thr-val" id="thrVal">70%</span>
    </div>
    <button class="btn-main" id="btnFetch" onclick="fetchAll()">🚀 분석 시작 (최근 2일)</button>
  </div>

  <div class="error-box" id="errBox"></div>

  <div class="results" id="results">
    <div class="stats-row" id="statsRow"></div>
    <div class="tabs">
      <button class="tab on" data-tab="all"  onclick="switchTab('all')">전체 <span class="badge" id="badgeAll">0</span></button>
      <button class="tab" data-tab="kw"      onclick="switchTab('kw')">🔍키워드 <span class="badge" id="badgeKw">0</span></button>
      <button class="tab" data-tab="sim"     onclick="switchTab('sim')">🔁유사 <span class="badge" id="badgeSim">0</span></button>
      <button class="tab" data-tab="saved"   onclick="switchTab('saved')">🔖보관 <span class="badge" id="badgeSaved">0</span></button>
    </div>

    <div class="pane on" id="pane-all">
      <div class="filter-bar" id="srcBar">
        <button class="fbtn on-all" onclick="filterSrc(this,'all')">전체</button>
        <button class="fbtn" onclick="filterSrc(this,'a')">블로그 A</button>
        <button class="fbtn" onclick="filterSrc(this,'b')">블로그 B</button>
      </div>
      <div class="post-list" id="listAll"></div>
    </div>

    <div class="pane" id="pane-kw">
      <div class="filter-bar" id="kwBar"></div>
      <div class="post-list" id="listKw"></div>
    </div>

    <div class="pane" id="pane-sim"><div id="listSim"></div></div>

    <div class="pane" id="pane-saved">
      <div class="section-label">🔖 북마크</div>
      <div class="post-list" id="listBm"></div>
      <div class="section-label" style="margin-top:16px;">🎨 음영 표시</div>
      <div class="post-list" id="listHl"></div>
    </div>
  </div>
</div>

<script>
const API='/api/rss';
const S={ get:k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch{return{}}}, set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}} };

let bookmarks=S.get('bm'), highlights=S.get('hl'), savedPosts=S.get('sp');
let keywords=[], allPosts=[], dedupedPosts=[], kwPosts=[], simPairs=[], activeSrc='all', activeKw='all';

function saveAll(){ S.set('bm',bookmarks); S.set('hl',highlights); S.set('sp',savedPosts); }

// KEYWORDS
document.getElementById('kwInput').addEventListener('keydown',e=>{if(e.key==='Enter')addKeyword();});
function addKeyword(){
  const v=document.getElementById('kwInput').value.trim();
  if(!v||keywords.includes(v)){document.getElementById('kwInput').value='';return;}
  keywords.push(v); document.getElementById('kwInput').value=''; renderChips();
}
function removeKeyword(kw){keywords=keywords.filter(k=>k!==kw);renderChips();}
function renderChips(){
  document.getElementById('chips').innerHTML=keywords.map(k=>
    `<span class="chip">${esc(k)}<button class="chip-x" onclick="removeKeyword('${escAttr(k)}')">×</button></span>`).join('');
}

// FETCH
async function fetchAll(){
  const idA=document.getElementById('blogA').value.trim(), idB=document.getElementById('blogB').value.trim();
  if(!idA||!idB){alert('블로그 ID를 모두 입력해주세요.');return;}
  const btn=document.getElementById('btnFetch');
  btn.disabled=true;
  document.getElementById('errBox').classList.remove('on');
  document.getElementById('results').classList.remove('on');
  const t0=Date.now();
  const ticker=setInterval(()=>{btn.textContent='⏳ '+((Date.now()-t0)/1000).toFixed(1)+'s 불러오는 중...';},100);
  try {
    const cut=Date.now()-2*24*60*60*1000;
    const [a,b]=await Promise.all([fetchRSS(idA,'a',cut),fetchRSS(idB,'b',cut)]);
    const merged=[...a,...b];
    if(!merged.length){showErr('최근 2일 내 게시물이 없습니다.');return;}
    processData(merged);
  } catch(e){showErr('오류: '+e.message);}
  finally{clearInterval(ticker);btn.disabled=false;btn.textContent='🚀 분석 시작 (최근 2일)';}
}

async function fetchRSS(id,src,cut){
  const res=await fetch(`${API}?url=${encodeURIComponent('https://rss.blog.naver.com/'+id+'.xml')}`);
  if(!res.ok) throw new Error(`블로그 ${src.toUpperCase()} 오류 (${res.status})`);
  const xml=new DOMParser().parseFromString(await res.text(),'text/xml');
  return [...xml.querySelectorAll('item')].map(i=>{
    const title=(i.querySelector('title')?.textContent||'').trim();
    const desc=(i.querySelector('description')?.textContent||'').replace(/<[^>]+>/g,'').trim();
    const link=i.querySelector('link')?.textContent||'#';
    const ds=i.querySelector('pubDate')?.textContent||'';
    const ts=ds?new Date(ds).getTime():0;
    return{title,desc,link,dateTs:ts,date:ts?new Date(ts).toLocaleDateString('ko-KR'):'',src,len:title.length+desc.length};
  }).filter(p=>p.dateTs>=cut);
}

// PROCESS
function processData(posts){
  allPosts=posts;
  const thr=parseInt(document.getElementById('thrSlider').value)/100;
  simPairs=[]; const losers=new Set();
  for(const pa of posts.filter(p=>p.src==='a')){
    for(const pb of posts.filter(p=>p.src==='b')){
      const sc=jaccard(pa.title+' '+pa.desc,pb.title+' '+pb.desc);
      if(sc>=thr){
        const win=pa.len>=pb.len?pa:pb, lose=pa.len>=pb.len?pb:pa;
        simPairs.push({postA:pa,postB:pb,score:Math.round(sc*100),winner:win,loser:lose});
        losers.add(lose.link);
      }
    }
  }
  dedupedPosts=allPosts.filter(p=>!losers.has(p.link));
  kwPosts=keywords.length===0?[]:dedupedPosts.filter(p=>keywords.some(kw=>p.title.toLowerCase().includes(kw.toLowerCase())));
  render();
}

function jaccard(a,b){
  const tok=t=>{const w=t.toLowerCase().replace(/[^\w가-힣\s]/g,'').split(/\s+/).filter(Boolean);const s=new Set();for(let i=0;i<w.length-1;i++)s.add(w[i]+' '+w[i+1]);if(!s.size)w.forEach(x=>s.add(x));return s;};
  const sa=tok(a),sb=tok(b),inter=[...sa].filter(x=>sb.has(x)).length,union=new Set([...sa,...sb]).size;
  return union?inter/union:0;
}

// RENDER
function render(){
  document.getElementById('results').classList.add('on');
  const sv=Object.keys(bookmarks).filter(k=>bookmarks[k]).length+Object.keys(highlights).filter(k=>highlights[k]).length;
  document.getElementById('statsRow').innerHTML=`
    <div class="sbox c-accent"><span>전체 게시물</span><strong>${allPosts.length}</strong></div>
    <div class="sbox c-green"><span>중복제거 후</span><strong>${dedupedPosts.length}</strong></div>
    <div class="sbox c-yellow"><span>유사 쌍</span><strong>${simPairs.length}</strong></div>
    <div class="sbox c-orange"><span>키워드 매칭</span><strong>${kwPosts.length}</strong></div>`;
  document.getElementById('badgeAll').textContent=dedupedPosts.length;
  document.getElementById('badgeKw').textContent=kwPosts.length;
  document.getElementById('badgeSim').textContent=simPairs.length;
  document.getElementById('badgeSaved').textContent=sv;
  renderAll(); renderKwBar(); renderKw(); renderSim(); renderSaved();
}

function filterSrc(btn,src){activeSrc=src;document.querySelectorAll('#srcBar .fbtn').forEach(b=>b.className='fbtn');btn.className='fbtn on-'+src;renderAll();}
function renderAll(){
  const list=activeSrc==='all'?dedupedPosts:dedupedPosts.filter(p=>p.src===activeSrc);
  document.getElementById('listAll').innerHTML=list.length?[...list].sort((a,b)=>b.dateTs-a.dateTs).map(p=>card(p,false)).join(''):empty('게시물이 없습니다.');
}

function renderKwBar(){
  if(!keywords.length){document.getElementById('kwBar').innerHTML='';return;}
  document.getElementById('kwBar').innerHTML=`<button class="fbtn on-all" onclick="filterKw(this,'all')">전체 (${kwPosts.length})</button>`+
    keywords.map(kw=>`<button class="fbtn" onclick="filterKw(this,'${escAttr(kw)}')">${esc(kw)} (${dedupedPosts.filter(p=>p.title.toLowerCase().includes(kw.toLowerCase())).length})</button>`).join('');
}
function filterKw(btn,kw){activeKw=kw;document.querySelectorAll('#kwBar .fbtn').forEach(b=>b.className='fbtn');btn.className='fbtn on-kw';renderKw();}
function renderKw(){
  if(!keywords.length){document.getElementById('listKw').innerHTML=empty('키워드를 추가해주세요.');return;}
  const list=activeKw==='all'?kwPosts:dedupedPosts.filter(p=>p.title.toLowerCase().includes(activeKw.toLowerCase()));
  document.getElementById('listKw').innerHTML=list.length?[...list].sort((a,b)=>b.dateTs-a.dateTs).map(p=>card(p,true)).join(''):empty('해당 키워드가 포함된 글이 없습니다.');
}

function renderSim(){
  const el=document.getElementById('listSim');
  if(!simPairs.length){el.innerHTML=empty('유사 게시물 쌍이 없습니다.<br>슬라이더를 낮춰보세요.');return;}
  el.innerHTML=[...simPairs].sort((a,b)=>b.score-a.score).map(({postA,postB,score,winner,loser})=>{
    const isWinA=winner===postA;
    const side=(p,w)=>`<div class="pair-side ${w?'winner':'loser'}"><div class="pair-side-label">${w?'✅ 채택':'🚫 제거됨'}</div><div class="pair-title"><a href="${p.link}" target="_blank">${esc(p.title)}</a></div><div class="pair-info">글자수 <span class="${w?'info-len':''}">${p.len}자</span> · ${p.src==='a'?'블로그 A':'블로그 B'} · ${p.date}</div></div>`;
    return`<div class="pair-card"><div class="pair-header">🔁 유사 게시물 <span class="sim-score">${score}%</span></div>${side(postA,isWinA)}${side(postB,!isWinA)}</div>`;
  }).join('');
}

function renderSaved(){
  const bmL=Object.keys(bookmarks).filter(k=>bookmarks[k]);
  const hlL=Object.keys(highlights).filter(k=>highlights[k]);
  document.getElementById('listBm').innerHTML=bmL.length?bmL.map(l=>savedPosts[l]?card(savedPosts[l],false):'').join(''):empty('북마크한 글이 없습니다.<br>카드 아래 🔖 버튼을 탭하세요.');
  document.getElementById('listHl').innerHTML=hlL.length?hlL.map(l=>savedPosts[l]?card(savedPosts[l],false):'').join(''):empty('음영 표시한 글이 없습니다.<br>카드 아래 🟡🔴🟢 버튼을 탭하세요.');
}

// CARD
function card(p,showKw){
  const l=p.link, bm=!!bookmarks[l], hl=highlights[l]||'';
  let kw='';
  if(showKw) keywords.filter(k=>p.title.toLowerCase().includes(k.toLowerCase())).forEach(k=>{kw+=`<span class="kbadge">${esc(k)}</span>`;});
  const ps=encodeURIComponent(JSON.stringify(p));
  return`<div class="pcard ${hl?'hl-'+hl:''} ${bm?'bookmarked':''}">
    <a class="card-link" href="${l}" target="_blank">
      <div class="pm">
        <span class="sbadge ${p.src}">${p.src==='a'?'블로그 A':'블로그 B'}</span>${kw}
        <span class="pdate">${p.date}</span>${bm?'<span style="margin-left:auto">🔖</span>':''}
      </div>
      <div class="ptitle">${hlKw(esc(p.title))}</div>
      <div class="pdesc">${esc(p.desc)}</div>
    </a>
    <div class="action-bar">
      <button class="act-btn ${bm?'bm-on':''}" onclick="toggleBM('${escAttr(l)}','${ps}')">🔖 ${bm?'해제':'북마크'}</button>
      <button class="act-btn ${hl==='yellow'?'hl-y-on':''}" onclick="toggleHL('${escAttr(l)}','yellow','${ps}')">🟡 노랑</button>
      <button class="act-btn ${hl==='pink'?'hl-p-on':''}"   onclick="toggleHL('${escAttr(l)}','pink','${ps}')">🔴 빨강</button>
      <button class="act-btn ${hl==='green'?'hl-g-on':''}"  onclick="toggleHL('${escAttr(l)}','green','${ps}')">🟢 초록</button>
    </div>
  </div>`;
}

function toggleBM(link,ps){
  let p; try{p=JSON.parse(decodeURIComponent(ps));}catch{p=allPosts.find(x=>x.link===link)||savedPosts[link];}
  if(bookmarks[link]){delete bookmarks[link];if(!highlights[link])delete savedPosts[link];}
  else{bookmarks[link]=true;if(p)savedPosts[link]=p;}
  saveAll(); render();
}
function toggleHL(link,color,ps){
  let p; try{p=JSON.parse(decodeURIComponent(ps));}catch{p=allPosts.find(x=>x.link===link)||savedPosts[link];}
  if(highlights[link]===color){delete highlights[link];if(!bookmarks[link])delete savedPosts[link];}
  else{highlights[link]=color;if(p)savedPosts[link]=p;}
  saveAll(); render();
}

function switchTab(n){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===n));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+n));
}
function showErr(m){const b=document.getElementById('errBox');b.textContent=m;b.classList.add('on');}
function hlKw(t){let r=t;keywords.forEach(k=>{r=r.replace(new RegExp(`(${escRe(k)})`,'gi'),'<mark>$1</mark>');});return r;}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escAttr(s){return(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function empty(m){return`<div class="empty"><div class="ico">🔍</div><p>${m}</p></div>`;}

window.addEventListener('DOMContentLoaded',()=>{
  const sv=Object.keys(bookmarks).filter(k=>bookmarks[k]).length+Object.keys(highlights).filter(k=>highlights[k]).length;
  document.getElementById('badgeSaved').textContent=sv;
  if(sv>0) renderSaved();
});
</script>
</body>
</html>
